<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Reaction settings</title>
		<style>
			body {
				margin: 0;
				padding: 8px 12px;
				background: #2d2d2d;
				color: #d8d8d8;
				font: 9pt -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
			}
			fieldset {
				display: flex;
				gap: 10px;
				margin: 0;
				padding: 0;
				border: 0;
			}
			legend {
				float: left;
				width: 92px;
				padding: 0;
				color: #969696;
				text-align: right;
			}
			.options {
				display: grid;
				grid-template-columns: repeat(3, 64px);
				grid-auto-rows: 64px;
				gap: 8px;
			}
			.tile {
				position: relative;
				display: block;
				cursor: pointer;
			}
			/* Visually hidden but focusable, so the radios keep their role and arrow-key navigation. */
			.tile input {
				position: absolute;
				width: 1px;
				height: 1px;
				margin: 0;
				opacity: 0;
				pointer-events: none;
			}
			.face {
				display: flex;
				align-items: center;
				justify-content: center;
				box-sizing: border-box;
				width: 100%;
				height: 100%;
				border: 2px solid #3d3d3d;
				border-radius: 10px;
				background: #3d3d3d;
			}
			.tile:hover .face {
				border-color: #5a5a5a;
			}
			.face img {
				display: block;
				width: 48px;
				height: 48px;
			}
			.tile input:checked + .face {
				border-color: #4a9eff;
				background: #24384f;
				box-shadow: 0 0 0 1px #4a9eff;
			}
			.tile input:focus-visible + .face {
				outline: 2px solid #ffffff;
				outline-offset: 2px;
			}
			p {
				margin: 12px 0 0 102px;
				color: #969696;
			}
		</style>
	</head>
	<body>
		<form id="settings">
			<fieldset>
				<legend id="reactions-label">Emoji Reactions</legend>
				<div class="options" role="radiogroup" aria-labelledby="reactions-label">
					<label class="tile" title="Like"><input type="radio" name="reaction" value="like" aria-label="Like" checked /><span class="face"><img src="../imgs/actions/like/key@2x.png" alt="" /></span></label>
					<label class="tile" title="Love"><input type="radio" name="reaction" value="love" aria-label="Love" /><span class="face"><img src="../imgs/actions/love/key@2x.png" alt="" /></span></label>
					<label class="tile" title="Applause"><input type="radio" name="reaction" value="applause" aria-label="Applause" /><span class="face"><img src="../imgs/actions/applause/key@2x.png" alt="" /></span></label>
					<label class="tile" title="Laugh"><input type="radio" name="reaction" value="laugh" aria-label="Laugh" /><span class="face"><img src="../imgs/actions/laugh/key@2x.png" alt="" /></span></label>
					<label class="tile" title="Surprised"><input type="radio" name="reaction" value="surprise" aria-label="Surprised" /><span class="face"><img src="../imgs/actions/surprise/key@2x.png" alt="" /></span></label>
				</div>
			</fieldset>
			<p>Each press sends the chosen reaction once. The key shows the chosen reaction.</p>
		</form>
		<script>
			"use strict";
			const DEFAULT_REACTION = "like";
			const form = document.getElementById("settings");
			let socket;
			let context;

			/** Checks the radio for a reaction, or Like when the reaction is missing or unknown. */
			function select(reaction) {
				const input = form.querySelector(`input[name="reaction"][value="${CSS.escape(String(reaction))}"]`)
					?? form.querySelector(`input[name="reaction"][value="${DEFAULT_REACTION}"]`);
				input.checked = true;
			}

			function send(event, payload) {
				if (socket?.readyState === WebSocket.OPEN) socket.send(JSON.stringify({ event, context, payload }));
			}

			form.addEventListener("change", () => {
				send("setSettings", { reaction: form.elements.reaction.value });
			});

			// Stream Deck calls this global when the Property Inspector opens.
			function connectElgatoStreamDeckSocket(port, uuid, registerEvent, _info, actionInfo) {
				context = uuid;
				let settings = {};
				try {
					settings = JSON.parse(actionInfo)?.payload?.settings ?? {};
				} catch {
					settings = {};
				}
				select(settings.reaction);
				socket = new WebSocket(`ws://127.0.0.1:${port}`);
				socket.addEventListener("open", () => {
					socket.send(JSON.stringify({ event: registerEvent, uuid }));
					// Store the shown choice when the settings hold none or an unknown one.
					const shown = form.elements.reaction.value;
					if (settings.reaction !== shown) send("setSettings", { reaction: shown });
				});
				socket.addEventListener("message", message => {
					let data;
					try {
						data = JSON.parse(message.data);
					} catch {
						return;
					}
					if (data.event === "didReceiveSettings") select(data.payload?.settings?.reaction);
				});
			}
			window.connectElgatoStreamDeckSocket = connectElgatoStreamDeckSocket;
		</script>
	</body>
</html>
